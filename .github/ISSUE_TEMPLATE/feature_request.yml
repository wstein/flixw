name: Feature request
description: Propose a narrowly scoped change to flixw.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the concrete workflow that is currently difficult.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the command, behaviour, and user-visible diagnostics.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Trust and compatibility impact
      description: Address stock-compiler compatibility, lock/cache effects, network use, and migration cost.
    validations:
      required: true
