name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the older head of the same pull request. The
# group names workflow, event and PR number, so different PRs never cancel one another.
# Every other event falls back to the run id: a push to main and a manual dispatch each get
# a group of their own and nothing displaces them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLIXW_TEST_VERSION: "0.79.0"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: sh tests/lint.sh
      - name: timing accounting checks (no JVM)
        run: |
          sh tests/timing-check.sh
          python3 tests/timing-report-check.py
      # pages.yaml runs this on a tag, where a failure means a release with no docs and
      # a schema URL serving whatever the previous tag left behind. Build it on every
      # commit instead, so the tag is not the first time anyone finds out.
      - name: the site builds
        run: sh tests/pages.sh "$RUNNER_TEMP/site"

  # The published JSON Schema is rendered by stage 0 and asserted by stage 0's own unit
  # checks, which is the one thing that cannot tell us whether it is a valid schema at all,
  # or whether an outside validator reads it the way flixw does. taplo is that outsider:
  # the same engine an editor runs when it follows the `#:schema` line in a generated lock.
  schema:
    name: schema (taplo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install taplo
        run: |
          curl -fsSL https://github.com/tamasfe/taplo/releases/latest/download/taplo-linux-x86_64.gz \
            | gunzip > /usr/local/bin/taplo
          chmod +x /usr/local/bin/taplo
      # tests/schema/README.md is the authority on which directory means what. Only these
      # two rows are claims about the schema; the other two are where the schema and stage
      # 0 are specified to disagree, and asserting taplo against them would assert nothing.
      - name: valid locks pass
        run: |
          fail=0
          for f in tests/schema/valid/*.toml; do
            if taplo check --schema "file://$PWD/docs/schema/lock-v1.schema.json" "$f"; then
              echo "ok    $f"
            else
              echo "FAIL  $f is filed as valid and taplo rejects it"; fail=1
            fi
          done
          exit $fail
      - name: invalid locks fail
        run: |
          fail=0
          for f in tests/schema/invalid/*.toml; do
            if taplo check --schema "file://$PWD/docs/schema/lock-v1.schema.json" "$f" 2>/dev/null; then
              echo "FAIL  $f is filed as invalid and taplo accepts it"; fail=1
            else
              echo "ok    $f"
            fi
          done
          exit $fail
      # An unknown key is the one case where the schema is deliberately stricter than the
      # wrapper. If additionalProperties ever stopped being enforced, nothing else here
      # would notice: every other fixture would still get the verdict it is filed under.
      - name: an unknown key is rejected by the schema alone
        run: |
          fail=0
          for f in tests/schema/advisory/*.toml; do
            if taplo check --schema "file://$PWD/docs/schema/lock-v1.schema.json" "$f" 2>/dev/null; then
              echo "FAIL  $f carries a key the schema should reject"; fail=1
            else
              echo "ok    $f"
            fi
          done
          exit $fail

  test:
    name: test (${{ matrix.os }}, java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: ["21"]
        # TESTED_CEILING is a claim that the suite has been run there. One job makes it
        # true continuously; running the ceiling on every OS would buy little, since what
        # changes between JDK versions is the JVM, not the shell around it.
        include:
          - os: ubuntu-latest
            java: "26"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      # Record whether Actions restored this entry separately from the suite state:
      # run.sh currently resets tests/.work/run, including any restored compiler.
      - uses: actions/cache@v6
        id: compiler-cache
        with:
          path: tests/.work/run/cache/compilers
          key: flix-${{ runner.os }}-${{ matrix.java }}-${{ env.FLIXW_TEST_VERSION }}
      - name: regression suite with timing
        env:
          FLIXW_TEST_CACHE_RESTORED: ${{ steps.compiler-cache.outputs.cache-hit || 'false' }}
        run: FLIXW_TEST_TIMINGS="$PWD/suite-timing.tsv" sh tests/run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: suite-timing-${{ runner.os }}-${{ matrix.java }}-source
          path: suite-timing.tsv
          if-no-files-found: error

  # What projects actually receive is the documented source with its commentary removed,
  # generated by tests/strip.java at release time. Every other job in this file tests the
  # *documented* file, so without this one the artifact people run would be the only thing
  # here nothing exercises -- and a stripper that mangled a string literal would be found
  # by whoever installed the release, not by us.
  #
  # The whole suite, against the stripped tree, because the claim being checked is
  # behavioural equivalence and a compile is not that. tests/lint.sh already proves the
  # stripper is deterministic and that its output compiles; this proves it still works.
  shipped:
    name: the stage 0 that ships
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: strip stage 0 in place
        run: |
          version=$(sed -n 's/.*WRAPPER_VERSION = "\([^"]*\)".*/\1/p' src/stage0/flixw.java | head -1)
          java tests/strip.java src/stage0/flixw.java "$version" > "$RUNNER_TEMP/flixw.java"
          # In place: the suite reads src/stage0/flixw.java throughout, and pointing it elsewhere
          # would test a path no user takes. The checkout is disposable.
          mv "$RUNNER_TEMP/flixw.java" src/stage0/flixw.java
          printf 'shipped stage 0 is %s lines\n' "$(wc -l < src/stage0/flixw.java)"
      - uses: actions/cache@v6
        id: compiler-cache
        with:
          path: tests/.work/run/cache/compilers
          key: flix-Linux-21-${{ env.FLIXW_TEST_VERSION }}
      - name: regression suite with timing
        env:
          FLIXW_TEST_TREE: shipped
          FLIXW_TEST_CACHE_RESTORED: ${{ steps.compiler-cache.outputs.cache-hit || 'false' }}
        run: FLIXW_TEST_TIMINGS="$PWD/suite-timing.tsv" sh tests/run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: suite-timing-${{ runner.os }}-21-shipped
          path: suite-timing.tsv
          if-no-files-found: error

  # Git Bash is present on every windows runner, and this project's reference repository
  # has used the POSIX shim there for months. Its own job, not the first step of the smoke
  # below: a suite failure used to skip every cmd.exe and PowerShell check after it, which
  # threw away the one native-Windows signal exactly when something was already wrong.
  windows-suite:
    name: windows suite (Git Bash)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: full suite under Git Bash
        shell: bash
        env:
          FLIXW_TEST_CACHE_RESTORED: not-configured
        run: FLIXW_TEST_TIMINGS="$PWD/suite-timing.tsv" sh tests/run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: suite-timing-Windows-21-source
          path: suite-timing.tsv
          if-no-files-found: error

  suite-timing:
    name: suite timing report
    if: always()
    needs: [test, shipped, windows-suite]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: suite-timing-*
          path: suite-timings
      - name: reconcile and summarize five suite runs
        run: |
          python3 tests/timing-report.py --expected 5 suite-timings/*/suite-timing.tsv > suite-timing.md
          cat suite-timing.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: suite-timing-report
          path: suite-timing.md
          if-no-files-found: error

  windows:
    name: windows smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # The cmd.exe shim is the path with no POSIX shell at all. It has no automated
      # coverage anywhere else, so exercise it end to end as a user would.
      # The project comes from a committed fixture rather than cmd.exe heredocs, whose
      # escaping rules for parentheses and backslashes would be the thing under test.
      - name: install into a scratch project
        shell: cmd
        run: |
          xcopy /E /I /Q tests\fixtures\smoke scratch || exit /b 1
          rem The bootstrap is the setup asset now; stage 0 has no install verb. Given an
          rem explicit stage 0 it fetches nothing, which is what keeps this step offline.
          java src\assets\flixw-setup.java setup scratch src\stage0\flixw.java || exit /b 1

      - name: pin, check and run through flixw.cmd
        shell: cmd
        working-directory: scratch
        run: |
          call flixw.cmd pin %FLIXW_TEST_VERSION% || exit /b 1
          call flixw.cmd wrapper --version || exit /b 1
          call flixw.cmd check || exit /b 1
          call flixw.cmd run || exit /b 1
          call flixw.cmd validate || exit /b 1

      # Argument fidelity through cmd.exe has no other coverage anywhere, and the failure
      # is silent: under delayed expansion `%*` is rescanned and `!x` disappears, so java
      # is started with an argument nobody typed. stage 0 quotes an unknown operation back,
      # which makes the whole path observable from outside.
      - name: an argument containing ! survives the shim
        shell: cmd
        working-directory: scratch
        run: |
          call flixw.cmd wrapper --frob!x 2>err.txt
          type err.txt
          findstr /c:"--frob!x" err.txt >nul || exit /b 1

      - name: the lossless fallback needs no shim
        shell: cmd
        working-directory: scratch
        run: java .flixw\flixw.java -- --version || exit /b 1

      # PowerShell can call flixw.cmd, which is why there is no .ps1: a Group Policy
      # execution policy cannot block a .cmd. Prove the path works.
      - name: flixw.cmd from PowerShell
        shell: pwsh
        working-directory: scratch
        run: |
          .\flixw.cmd wrapper --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
