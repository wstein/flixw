name: release

# Tag-driven, because the version a release publishes is the one compiled into
# src/flixw.java: the tag says which commit, and the commit says which version. The job
# refuses to publish if the two disagree, which is the mistake this automation makes
# possible in the first place.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to (re)build the assets for"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build and publish the release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The assets must not be able to disagree with the source they were cut from, so
      # the same checks that gate a commit gate a release. Nothing here is a smoke test:
      # run.sh is what proves the archives unpack to exactly what `install` writes.
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: sh tests/lint.sh
      - run: sh tests/run.sh

      - name: the tag must match WRAPPER_VERSION
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(java src/flixw.java wrapper --version | head -1 | cut -d' ' -f2)
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match WRAPPER_VERSION $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - run: sh tests/pack.sh dist

      # softprops and friends are third-party actions with write scope on the repository;
      # gh is preinstalled and does the same job with no supply chain to audit.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          notes=$(mktemp)
          {
            printf '## Install into an existing project\n\n'
            printf '```console\ncurl -fsSLO https://github.com/%s/releases/download/%s/flixw-%s.tar.gz\n' \
                   "$GITHUB_REPOSITORY" "$TAG" "$version"
            printf 'tar -xzf flixw-%s.tar.gz     # writes flixw, flixw.cmd, .flixw/flixw.java\n' "$version"
            printf './flixw pin <flix-version>     # writes the lock and fetches the compiler\n'
            printf './flixw doctor --fix           # merges the .gitattributes block\n```\n\n'
            printf 'A `.zip` with the same contents is attached for machines without `tar`, and '
            printf '`flixw-setup.java` on its own is the one-file route: verify it, run it,\n'
            printf 'and it fetches this release'"'"'s stage 0.\n\n'
            printf 'The `flixw-*.java` assets are companion programs, fetched on first use '
            printf 'per machine and verified against the digests below. They are not '
            printf 'installed into a project; `wrapper --upgrade` warms all of them.\n\n'
            printf '`picocli-*.jar` is the one third-party component flixw ships. It is the '
            printf 'unmodified upstream artifact, Apache-2.0, used only by `flixw-help.java` '
            printf 'and only by `./flixw help`. Stage 0 never loads it and no project ever '
            printf 'commits it; see `THIRD_PARTY_NOTICES.md`, attached.\n\n'
            printf 'Verify before you run it -- these digests are the ones this workflow built:\n\n'
            printf '```\n'
            cat dist/SHA256SUMS
            printf '```\n'
          } > "$notes"
          # Every 0.x is a pre-release. The paper calls this an experiment and the README
          # says so on its first line; publishing them as finished releases would say
          # otherwise in the one place people look. Drop the flag at 1.0.
          #
          # It has a functional consequence worth knowing: GitHub's `latest` pointer skips
          # pre-releases, and FLIXW_LATEST is releases/latest/download/ -- so
          # `wrapper --upgrade` does not offer a pre-release, and an adopter has to ask for
          # it by URL. That is the right default for an experiment, and it is why the
          # install instructions in the notes name the tag rather than `latest`.
          case $version in
            0.*) pre=--prerelease ;;
            *)   pre= ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            # shellcheck disable=SC2086  # $pre is one optional flag, deliberately unquoted
            gh release edit "$TAG" --notes-file "$notes" $pre
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" dist/* --title "flixw $version" --notes-file "$notes" $pre
          fi
