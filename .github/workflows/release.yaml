name: release

# Tag-driven, because the version a release publishes is the one compiled into
# src/stage0/flixw.java: the tag says which commit, and the commit says which version. The job
# refuses to publish if the two disagree, which is the mistake this automation makes
# possible in the first place.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to (re)build the assets for"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build and publish the release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The assets must not be able to disagree with the source they were cut from, so
      # the same checks that gate a commit gate a release. Nothing here is a smoke test:
      # run.sh is what proves the archives unpack to exactly what `install` writes.
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: sh tests/lint.sh
      - run: sh tests/run.sh

      - name: the tag must match WRAPPER_VERSION
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(java src/stage0/flixw.java wrapper --version | head -1 | cut -d' ' -f2)
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match WRAPPER_VERSION $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      # The suite above ran against the documented source. What a release publishes is that
      # file with its commentary stripped, and the claim for the stripper is behavioural
      # equivalence -- which compiling does not establish. CI's `shipped` job proves it for
      # every commit on main, but a tag is its own ref and the release gate should not depend
      # on another workflow having looked. Run in a scratch copy so the packing below still
      # cuts from the real tree.
      - name: the stripped stage 0 passes the suite too
        run: |
          cp src/stage0/flixw.java "$RUNNER_TEMP/flixw.java.orig"
          java tests/strip.java src/stage0/flixw.java "$version" > "$RUNNER_TEMP/stripped.java"
          mv "$RUNNER_TEMP/stripped.java" src/stage0/flixw.java
          printf 'shipped stage 0 is %s lines\n' "$(wc -l < src/stage0/flixw.java)"
          sh tests/run.sh
          mv "$RUNNER_TEMP/flixw.java.orig" src/stage0/flixw.java

      - run: sh tests/pack.sh dist

      # softprops and friends are third-party actions with write scope on the repository;
      # gh is preinstalled and does the same job with no supply chain to audit.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          notes=$(mktemp)
          {
            # Setup-first, matching the README's own order. The one-file route is the one
            # somebody can actually audit before running -- ~640 lines against stage 0's
            # 3000 -- so it leads, and the digest is printed above the command rather than
            # piped into a checker, because a reader who cannot see it cannot check it.
            setup_sha=$(awk '$2 == "flixw-setup.java" { print $1 }' dist/SHA256SUMS)
            printf '## Start here: one file, verified\n\n'
            printf '```console\ncurl -fsSLO https://github.com/%s/releases/download/%s/flixw-setup.java\n' \
                   "$GITHUB_REPOSITORY" "$TAG"
            printf 'sha256sum flixw-setup.java          # macOS: shasum -a 256 flixw-setup.java\n```\n\n'
            printf 'It must print exactly this, and if it does not, stop:\n\n'
            printf '```\n%s  flixw-setup.java\n```\n\n' "$setup_sha"
            printf 'Then, in the project you want to use Flix in:\n\n'
            printf '```console\njava ./flixw-setup.java        # writes flixw, flixw.cmd and .flixw/flixw.java\n'
            printf './flixw pin <flix-version>     # writes the lock and fetches the compiler\n'
            printf './flixw doctor --fix           # merges the .gitattributes block\n```\n\n'
            printf 'It fetches this release'"'"'s stage 0 and verifies it against the digests '
            printf 'below.\n\n'
            printf '## Or the archive, if you would rather not run a downloaded program first\n\n'
            printf '```console\ncurl -fsSLO https://github.com/%s/releases/download/%s/flixw-%s.tar.gz\n' \
                   "$GITHUB_REPOSITORY" "$TAG" "$version"
            printf 'tar -xzf flixw-%s.tar.gz   # writes flixw, flixw.cmd, .flixw/flixw.java\n' "$version"
            printf './flixw pin <flix-version>\n./flixw doctor --fix\n```\n\n'
            printf 'A `.zip` with the same contents is attached for machines without `tar`. '
            printf 'Both archives are built by running the installer into a staging directory, '
            printf 'so the archive route cannot drift from the install route.\n\n'
            printf '## The companion assets\n\n'
            printf 'The `flixw-*.java` assets are companion programs, fetched on first use '
            printf 'per machine and verified against the digests below. They are not '
            printf 'installed into a project; `wrapper --upgrade` warms all of them.\n\n'
            printf '`picocli-*.jar` is the one third-party component flixw ships. It is the '
            printf 'unmodified upstream artifact, Apache-2.0, used only by `flixw-help.java` '
            printf 'and only by `./flixw help`. Stage 0 never loads it and no project ever '
            printf 'commits it; see `THIRD_PARTY_NOTICES.md`, attached.\n\n'
            printf '`flixw.java` here is the stripped stage 0 -- the documented source with '
            printf 'its commentary removed. `java tests/strip.java src/stage0/flixw.java %s ' "$version"
            printf '"stage 0"` at tag %s regenerates it byte for byte.\n\n' "$TAG"
            printf '## Verify before you run it\n\n'
            printf 'These digests are the ones this workflow built:\n\n'
            printf '```\n'
            cat dist/SHA256SUMS
            printf '```\n\n'
            printf 'The digest above the setup command is printed on this page *and* in the '
            printf "repository's README, which is a different artifact with its own history "
            printf '%s\n' '-- a second opinion rather than an echo.'
          } > "$notes"
          # A pre-release is one that says so in its version -- 0.26.0-rc.1 -- and nothing
          # else is.
          #
          # Every 0.x used to be flagged, on the grounds that the README calls this an
          # experiment and shipping "releases" would say otherwise. The reasoning was
          # sound and the consequence was not: GitHub's `latest` pointer skips
          # pre-releases, and FLIXW_LATEST is releases/latest/download/, so
          # `wrapper --upgrade` could not offer any release at all while the version
          # started with a 0. A wrapper whose own upgrade path cannot reach its own
          # newest release -- including the one fixing a bug in the upgrade path --
          # fails at something load-bearing to avoid overstating maturity, which the
          # README's first line already handles.
          case $version in
            *-*) pre=--prerelease ;;
            *)   pre= ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            # shellcheck disable=SC2086  # $pre is one optional flag, deliberately unquoted
            gh release edit "$TAG" --notes-file "$notes" $pre
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" dist/* --title "flixw $version" --notes-file "$notes" $pre
          fi
