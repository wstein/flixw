# Minimal project used by the Windows smoke job. `flix pin` rewrites the version.
# Flix 0.78 and later accept only version, repository and flix in [package]; 0.76 and
# older still require name, description and authors. CI tests against 0.78 or later.
[package]
version     = "0.1.0"
flix        = "0.75.2"
